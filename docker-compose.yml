name: ${COMPOSE_PROJECT_NAME:-wfm}

services:

  postgres:
    image: postgres:16
    container_name: wfm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "${POSTGRES_APP_DB},airflow,mlflow"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - wfm_pg_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wfm_net

  minio:
    image: minio/minio:latest
    container_name: wfm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - wfm_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wfm_net

  minio-init:
    image: minio/mc:latest
    container_name: wfm_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/mlflow-artifacts &&
      mc mb -p local/wfm-datalake &&
      exit 0
      "
    networks:
      - wfm_net

  mlflow:
    build:
      context: ./docker/mlflow
    container_name: wfm_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - wfm_net

  airflow-init:
    build:
      context: ./docker/airflow
    container_name: wfm_airflow_init
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      processed-data-init:
        condition: service_completed_successfully
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Used by dag_ingestion.py to reach Postgres (wfm_app db) and MinIO
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Needed by mlflow.<flavor>.log_model() to upload model artifacts to MinIO
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data/simulator:/opt/airflow/data_simulator
      - ./data/raw:/opt/airflow/data_raw
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./ml/forecasting:/opt/airflow/ml_forecasting
      - ./ml/attrition:/opt/airflow/ml_attrition
      - ./ml/optimization:/opt/airflow/ml_optimization
      - ./data/raw:/opt/wfm_data/raw
      - wfm_processed_data:/opt/wfm_data/processed
    networks:
      - wfm_net

  airflow-webserver:
    build:
      context: ./docker/airflow
    container_name: wfm_airflow_web
    restart: unless-stopped
    user: root
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data/simulator:/opt/airflow/data_simulator
      - ./data/raw:/opt/airflow/data_raw
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./ml/forecasting:/opt/airflow/ml_forecasting
      - ./ml/attrition:/opt/airflow/ml_attrition
      - ./ml/optimization:/opt/airflow/ml_optimization
      - ./data/raw:/opt/wfm_data/raw
      - wfm_processed_data:/opt/wfm_data/processed
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - wfm_net

  airflow-scheduler:
    build:
      context: ./docker/airflow
    container_name: wfm_airflow_scheduler
    restart: unless-stopped
    user: root
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data/simulator:/opt/airflow/data_simulator
      - ./data/raw:/opt/airflow/data_raw
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./ml/forecasting:/opt/airflow/ml_forecasting
      - ./ml/attrition:/opt/airflow/ml_attrition
      - ./ml/optimization:/opt/airflow/ml_optimization
      - ./data/raw:/opt/wfm_data/raw
      - wfm_processed_data:/opt/wfm_data/processed
    networks:
      - wfm_net

  processed-data-init:
    image: busybox
    container_name: wfm_processed_init
    volumes:
      - wfm_processed_data:/opt/wfm_data/processed
    command: ["sh", "-c", "chmod -R 777 /opt/wfm_data/processed"]
    networks:
      - wfm_net

  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: wfm_spark_master
    restart: unless-stopped
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8090:8080"
    volumes:
      - ./data/raw:/opt/wfm_data/raw
      - wfm_processed_data:/opt/wfm_data/processed
    networks:
      - wfm_net

  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: wfm_spark_worker
    restart: unless-stopped
    user: root
    depends_on:
      - spark-master
      - processed-data-init
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    ports:
      - "8091:8081"
    volumes:
      - ./data/raw:/opt/wfm_data/raw
      - wfm_processed_data:/opt/wfm_data/processed
    networks:
      - wfm_net

networks:
  wfm_net:
    name: wfm_network

volumes:
  wfm_pg_data:
    name: wfm_pg_data
  wfm_minio_data:
    name: wfm_minio_data
  wfm_processed_data:
    name: wfm_processed_data